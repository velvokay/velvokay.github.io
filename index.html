<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Yakovlev</title>
  <link href="dist/output.css" rel="stylesheet">
</head>

<body class="bg-white text-gray-900 font-sans p-6 md:p-10">
  <div class="mx-auto max-w-vignelli grid grid-cols-12 gap-gut">

    <!-- Header (full width) -->
    <header class="col-span-12 mb-8">
      <h1 class="text-4xl font-bold lowercase tracking-wide">Alex Yakovlev</h1>
      <p class="text-lg text-gray-600 mt-2">Engineering and design portfolio</p>
    </header>

    <!-- Sidebar (3 cols) -->
    <aside class="col-span-12 md:col-span-3">
      <nav aria-label="Main navigation" class="space-y-2 text-sm">
        <a href="index.html" aria-current="page" class="block text-gray-700 hover:text-black">Projects</a>
        <a href="about.html" class="block text-gray-700 hover:text-black">About</a>
      </nav>
    </aside>

    <!-- Main Content (9 cols) -->
    <main class="col-span-12 min-w-0 md:col-span-9">
      <section class="col-span-12 grid grid-cols-12 gap-gut mt-10">

        <!-- Project 1 -->
        <div class="col-span-12 md:col-span-6 flex flex-col min-w-0 gap-4 mb-8">
          <img
            src="images/img1.png"
            alt="Business Connect"
            class="w-full object-cover rounded"
          >
          <div>
            <h2 class="text-xl font-semibold mb-2">Business Connect</h2>
            <p class="text-sm text-gray-600 leading-relaxed">
              A platform connecting small business owners with their Apple Maps location.
            </p>
          </div>
        </div>

        <!-- Project 2 -->
        <a
          href="https://flashcoder.io"
          target="_blank"
          rel="noopener noreferrer"
          class="col-span-12 md:col-span-6 flex flex-col min-w-0 gap-4 mb-8 cursor-pointer hover:opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 transition-opacity"
        >
          <img
            src="images/project2.jpg"
            alt="FlashCode"
            class="w-full object-cover rounded"
          >
          <div>
            <h2 class="text-xl font-semibold mb-2">FlashCode</h2>
            <p class="text-sm text-gray-600 leading-relaxed">
              Study technical interview problems using spaced repetition.
            </p>
          </div>
        </a>

      </section>
    </main>

  </div>
</body>
</html>
